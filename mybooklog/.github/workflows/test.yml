name: Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run unit tests with coverage
        run: |
          flutter test test/unit/ \
            --coverage \
            --coverage-path=coverage/unit.lcov \
            --reporter=json > test-results/unit.json

      - name: Run widget tests with coverage
        run: |
          flutter test test/widget/ \
            --coverage \
            --coverage-path=coverage/widget.lcov \
            --reporter=json > test-results/widget.json || true

      - name: Merge coverage reports
        run: |
          mkdir -p test-results
          lcov --add-tracefile coverage/unit.lcov \
               --add-tracefile coverage/widget.lcov \
               -o coverage/lcov.info

      - name: Generate HTML coverage report
        run: |
          genhtml coverage/lcov.info -o coverage/html

      - name: Check coverage threshold
        run: |
          bash .github/scripts/check_coverage.sh 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            test-results/
            coverage/

  performance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run performance benchmarks
        run: flutter test test/benchmarks/ --profile
        continue-on-error: true

      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmarks
          path: benchmark-results/

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --profile

      - name: Build APK
        run: flutter build apk --profile
