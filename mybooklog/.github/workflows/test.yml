name: Flutter Tests & Coverage

on:
  push:
    branches: [ main, develop, 'test/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Get dependencies
        run: cd mybooklog && flutter pub get

      - name: Analyze code
        run: cd mybooklog && flutter analyze

      - name: Format check
        run: cd mybooklog && dart format --set-exit-if-changed .

      - name: Run tests with coverage
        run: cd mybooklog && flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./mybooklog/coverage/lcov.info
          flags: unittests

      - name: Check coverage threshold
        run: |
          cd mybooklog

          # Extract coverage percentage
          COVERAGE=$(python3 << 'EOF'
          import json
          import re
          from pathlib import Path

          # Read lcov.info to calculate coverage
          lcov_file = Path('coverage/lcov.info')
          total_lines = 0
          covered_lines = 0

          for line in lcov_file.read_text().split('\n'):
            if line.startswith('LF:'):
              total_lines += int(line[3:])
            elif line.startswith('LH:'):
              covered_lines += int(line[3:])

          if total_lines > 0:
            pct = (covered_lines / total_lines) * 100
            print(f"{pct:.1f}")
          else:
            print("0.0")
          EOF
          )

          echo "Coverage: ${COVERAGE}%"

          # Check minimum threshold (50% - Phase 3 baseline + buffer)
          THRESHOLD=50.0
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below minimum ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets minimum ${THRESHOLD}%"
          fi

      - name: Generate coverage report
        run: |
          mkdir -p build/reports
          cp mybooklog/coverage/lcov.info build/reports/ || true

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/
          retention-days: 30
        if: always()
