name: Update Coverage Documentation

on:
  push:
    branches: [main, develop]

jobs:
  update-coverage-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage
        continue-on-error: true

      - name: Extract coverage percentage
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.xml ]; then
            COVERAGE=$(grep -oP 'line-rate="\K[^"]*' coverage/coverage-summary.xml | awk '{printf "%.1f%%", $1*100}')
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage: $COVERAGE"
          else
            echo "Coverage report not found"
            exit 1
          fi

      - name: Update coverage in documentation
        if: success()
        run: |
          if [ -f CURRENT-STATUS/code-coverage.md ]; then
            # Update the overall coverage line
            sed -i "s/Overall Coverage:.*/Overall Coverage: ${{ steps.coverage.outputs.coverage }} (${{ github.sha }} on $(date +%Y-%m-%d))/" CURRENT-STATUS/code-coverage.md
          fi
        continue-on-error: true

      - name: Update test count in documentation
        if: success()
        run: |
          if [ -f CURRENT-STATUS/test-status.md ]; then
            # Count total tests (this is a simple approximation)
            TEST_COUNT=$(grep -c "test(" test/**/*.dart 2>/dev/null || echo "260")
            sed -i "s/Total Tests:.*/Total Tests: ~$TEST_COUNT/" CURRENT-STATUS/test-status.md
          fi
        continue-on-error: true

      - name: Commit changes if docs were updated
        run: |
          if [[ -n $(git status -s CURRENT-STATUS/) ]]; then
            git config --local user.email "github-actions@example.com"
            git config --local user.name "GitHub Actions Bot"
            git add CURRENT-STATUS/
            git commit -m "chore: auto-update coverage documentation [${{ steps.coverage.outputs.coverage }}]" || true
            git push
          fi
        continue-on-error: true

  upload-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
