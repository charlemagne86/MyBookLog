# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  precision: 2
  round: down
  layout: "reach,diff,flags,tree"
  show_carryforward_flags: false

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        # Build will fail if coverage drops below 60%
        threshold: 60%
        if_ci_failed: success
        informational: false
    patch:
      default:
        threshold: 80%
        if_ci_failed: success
        informational: false

ignore:
  - "test"
  - "**/*.freezed.dart"
  - "**/*.g.dart"
  - "**/generated"

flags:
  unittests:
    carryforward: true
