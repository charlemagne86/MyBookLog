name: Phase 4 Tests - iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  phase4-ios-tests:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: List available iOS simulators
        run: xcrun xctrace list devices

      - name: Start iOS Simulator
        run: |
          # Start simulator in background
          open -a Simulator &
          sleep 30

      - name: Get simulator ID
        run: |
          SIMULATOR=$(xcrun simctl list devices available iPhone | grep -oE 'iPhone [^ ]+' | head -1 | xargs -I {} xcrun simctl list devices | grep {} | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          echo "SIMULATOR=$SIMULATOR" >> $GITHUB_ENV

      - name: Run Phase 4 Performance Tests (iOS)
        run: |
          flutter test integration_test/performance/ \
            --verbose \
            -d iPhone
        timeout-minutes: 15

      - name: Run Phase 4 E2E Tests (iOS)
        run: |
          flutter test integration_test/e2e/ \
            --verbose \
            -d iPhone
        timeout-minutes: 15

      - name: Collect test coverage
        run: |
          flutter test integration_test/ \
            --coverage \
            -d iPhone
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage
          path: coverage/
          retention-days: 7

  phase4-android-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: |
            flutter test integration_test/performance/ \
              --verbose
            flutter test integration_test/e2e/ \
              --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: build/
          retention-days: 7

  coverage-report:
    needs: [phase4-ios-tests, phase4-android-tests]
    runs-on: macos-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v3
        with:
          name: ios-coverage
          path: coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: phase4-tests
          name: Phase 4 Coverage
          fail_ci_if_error: false
