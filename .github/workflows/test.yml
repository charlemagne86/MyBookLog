name: Flutter Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for coverage comparison

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Get dependencies
      working-directory: ./mybooklog
      run: flutter pub get

    - name: Analyze code
      working-directory: ./mybooklog
      run: flutter analyze

    - name: Format check
      working-directory: ./mybooklog
      run: dart format --set-exit-if-changed .

    - name: Run tests with coverage
      working-directory: ./mybooklog
      run: flutter test --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./mybooklog/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check coverage threshold
      run: |
        # Extract coverage percentage
        COVERAGE=$(python3 << 'EOF'
        import json
        import re
        from pathlib import Path

        # Read lcov.info to calculate coverage
        lcov_file = Path('mybooklog/coverage/lcov.info')
        total_lines = 0
        covered_lines = 0

        for line in lcov_file.read_text().split('\n'):
          if line.startswith('LF:'):
            total_lines += int(line[3:])
          elif line.startswith('LH:'):
            covered_lines += int(line[3:])

        if total_lines > 0:
          pct = (covered_lines / total_lines) * 100
          print(f"{pct:.1f}")
        else:
          print("0.0")
        EOF
        )

        echo "Coverage: ${COVERAGE}%"

        # Check minimum threshold (60%)
        THRESHOLD=60.0
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below minimum ${THRESHOLD}%"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE}% meets minimum threshold"
        fi

    - name: Generate coverage report
      if: always()
      run: |
        mkdir -p build/reports
        cp mybooklog/coverage/lcov.info build/reports/ || true

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/reports/
        retention-days: 30
